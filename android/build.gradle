// Gradle build used by androiddeployqt (via ECM's create-apk), modeled on KDE apps.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: 'com.android.application'
apply from: '../ecm-version.gradle'

// SALDO_APK_DEV=1 (tools/build-apk.sh --dev): a test build that installs next
// to the real app, under its own id, name and data.
def saldoDev = System.getenv('SALDO_APK_DEV') == '1'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}

android {
    // androidBuildToolsVersion, androidCompileSdkVersion, androidNdkVersion and
    // qtAndroidDir are written to gradle.properties by androiddeployqt.
    compileSdkVersion androidCompileSdkVersion
    buildToolsVersion androidBuildToolsVersion
    ndkVersion androidNdkVersion

    packagingOptions.jniLibs.useLegacyPackaging true

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qtAndroidDir + '/src', 'src', 'java']
            aidl.srcDirs = [qtAndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qtAndroidDir + '/res', 'res']
            resources.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
    }
    buildTypes {
        release {
            // The test build is debuggable: Qt only passes the arguments of an
            // adb start (applicationArguments: --demo, --page, --theme) to
            // debuggable apps, and `adb shell run-as` can read its files.
            debuggable saldoDev
        }
    }

    defaultConfig {
        minSdkVersion qtMinSdkVersion
        targetSdkVersion qtTargetSdkVersion
        applicationId "io.github.hernique33comiitei.saldo" + (saldoDev ? ".dev" : "")
        namespace "io.github.hernique33comiitei.saldo"
        versionName ecmVersionName
        versionCode ecmVersionCode
        manifestPlaceholders = [versionName: ecmVersionName, versionCode: ecmVersionCode,
                                appLabel: saldoDev ? "Saldo (dev)" : "Saldo"]
    }
}
