; KDE Craft overrides for the Android build (tools/build-apk.sh, release.yml).
; Read after craft-ci/qt6/CraftConfig.ini, so these keys win.

[GeneralSettings]
; APKs are signed by tools/sign-apk.sh with our own keystore, not KDE's service.
CodeSigning/Enabled = False

[BlueprintSettings]
libs/qt.qtMajorVersion = 6
saldo.buildTests = False

[android-arm64-clang]
; KDE's runners use /mnt/craft-android; keep downloads inside the work dir.
Paths/DownloadDir = ${Variables:Root}/downloads
