name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

# Build jobs only read the repo; `publish` is the only job that can write.
permissions:
  contents: read

jobs:
  check:
    name: Check versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions match each other and the tag
        run: |
          set -euo pipefail
          cmake_v=$(sed -nE 's/^project\(saldo VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          spec_v=$(sed -nE 's/^Version:[[:space:]]*([0-9.]+).*/\1/p' packaging/fedora/saldo.spec)
          deb_v=$(head -1 debian/changelog | sed -nE 's/^saldo \(([0-9.]+)-[0-9]+\).*/\1/p')
          meta_v=$(grep -oE '<release version="[0-9.]+"' data/*.metainfo.xml | head -1 | grep -oE '[0-9]+(\.[0-9]+)+')
          echo "CMake $cmake_v · spec $spec_v · debian $deb_v · metainfo $meta_v"
          if [ "$spec_v" != "$cmake_v" ] || [ "$deb_v" != "$cmake_v" ] || [ "$meta_v" != "$cmake_v" ]; then
            echo "::error::Versions differ; run tools/bump-version.sh"; exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "${GITHUB_REF_NAME#v}" != "$cmake_v" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $cmake_v"; exit 1
          fi

  # One package per distribution release, each built in a clean container of
  # it (a package installs on the release it was built on, or newer) by
  # tools/build-packages.sh, the same script used to check them locally.
  rpm:
    name: Build RPM (${{ matrix.image }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Fedora 44's RPM also installs on 45 and newer.
        image: ['fedora:42', 'fedora:43', 'fedora:44']
    steps:
      - uses: actions/checkout@v4
      - name: Build RPM
        run: tools/build-packages.sh "${{ matrix.image }}"
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ strategy.job-index }}
          path: dist/*.rpm
          if-no-files-found: error

  deb:
    name: Build DEB (${{ matrix.image }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Debian 13's DEB also installs on testing; Ubuntu 26.04's on 26.10.
        # Older releases lack KDE Frameworks 6 (Debian 12, Ubuntu 24.04).
        image: ['debian:13', 'ubuntu:26.04']
    steps:
      - uses: actions/checkout@v4
      - name: Build DEB
        run: tools/build-packages.sh "${{ matrix.image }}"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ strategy.job-index }}
          path: dist/*.deb
          if-no-files-found: error

  # Smoke test on every supported release before publishing: the right package
  # installs, `saldo --version` answers and the demo shows every page with no
  # QML warning (tools/test-package.sh; CLAUDE.md, "Packaging").
  test:
    name: Test on ${{ matrix.image }}
    needs: [rpm, deb]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:42', 'fedora:43', 'fedora:44', 'fedora:45',
                'debian:13', 'debian:testing', 'ubuntu:26.04', 'ubuntu:26.10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '{rpm,deb}-*'
          merge-multiple: true
      - name: Install and run the demo on every page
        run: tools/test-package.sh "${{ matrix.image }}" dist

  apk:
    name: Build APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # KDE's Android image and Craft's prebuilt Qt/KF6 need ~20 GB; keep the
        # runner's Android SDK (apksigner) and drop the rest.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Build APK with KDE Craft
        run: tools/build-apk.sh --docker
      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for apk in dist/*-unsigned.apk; do tools/sign-apk.sh "$apk"; done
          rm -f dist/*-unsigned.apk
          ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

  # One release, created only when every package built and passed its tests
  # (every release carries the RPMs, the DEBs and the APK), with the curated
  # changelog as its text.
  publish:
    name: Publish release
    needs: [test, apk]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from debian/changelog
        run: |
          awk 'NR>1 && /^ -- /{exit} NR>1 && /^  \* /{sub(/^  \* /,"- "); print} NR>1 && /^    /{sub(/^    /,"  "); print}' \
            debian/changelog > notes.md
          cat notes.md
          ls -l dist/
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
